name: Beta Release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  android-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches pubspec version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version:[[:space:]]*//')
          BUILD_NAME="${VERSION_LINE%%+*}"
          if [ "$TAG" != "$BUILD_NAME" ]; then
            echo "Tag version ($TAG) does not match pubspec build-name ($BUILD_NAME)"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # The codename the app shows for this build, for the release title.
      - name: Codename
        id: codename
        run: echo "name=$(dart run tool/release.dart --print-codename | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release key from the repository secrets. Without the secrets the
      # build falls back to the debug key (see android/app/build.gradle.kts).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this build is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Build APK
        run: |
          rm -f android/gradle/gradle-daemon-jvm.properties
          flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-android-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      # A full release marked Latest, so each beta shows on the repo page
      # (GitHub never shows a pre-release as Latest). The version name
      # still says beta.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (${{ steps.codename.outputs.name }})
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
